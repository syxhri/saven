<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="savenGradDark" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="savenAccentDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Neobrutalist Dark Mode Hard Drop Shadow -->
  <rect x="18" y="18" width="84" height="84" rx="24" fill="#4338CA" fill-opacity="0.6" />

  <!-- Badge Background -->
  <rect x="14" y="14" width="84" height="84" rx="24" fill="#0B0F19" stroke="#818CF8" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- S Shape Geometric Ribbon -->
  <path d="M72 35 C72 28, 44 26, 38 36 C32 46, 68 47, 66 63 C64 77, 34 76, 34 68" 
        stroke="url(#savenGradDark)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Dynamic Accent -->
  <path d="M48 62 L56 70 L76 50" 
        stroke="url(#savenAccentDark)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Playful Glowing Dot -->
  <circle cx="78" cy="30" r="5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2"/>
</svg>
