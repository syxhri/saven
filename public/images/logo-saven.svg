<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="savenGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="savenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Neobrutalist Hard Drop Shadow -->
  <rect x="18" y="18" width="84" height="84" rx="24" fill="#0F172A" />

  <!-- Badge Background -->
  <rect x="14" y="14" width="84" height="84" rx="24" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>

  <!-- S Shape Geometric Ribbon -->
  <path d="M72 35 C72 28, 44 26, 38 36 C32 46, 68 47, 66 63 C64 77, 34 76, 34 68" 
        stroke="url(#savenGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Dynamic Accent (Checkmark) -->
  <path d="M48 62 L56 70 L76 50" 
        stroke="url(#savenAccent)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Playful Geometric Dot -->
  <circle cx="78" cy="30" r="5" fill="#F59E0B" stroke="#0F172A" stroke-width="2.5"/>
</svg>
